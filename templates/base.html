<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}MuscleMap{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">

  <!-- jQuery (must be loaded before other scripts) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">💪 MuscleMap</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('home') }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('muscle_map') }}">Muscle Map</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('quiz') }}">Quiz</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('quizgame') }}">Train That Muscle!</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Page content -->
  <main class="container py-5 text-center">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center text-muted py-4">
    <small>&copy; 2025 MuscleMap. Built with Flask, Bootstrap, and 💪.</small>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom JavaScript -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  
  <!-- Extra JavaScript -->
  {% block extra_js %}{% endblock %}

  <!-- Progress Tracker JavaScript -->
  <script src="{{ url_for('static', filename='progress-tracker.js') }}"></script>
</body>
</html>
