{% extends "base.html" %}

{% block title %}{{ muscle_name.title() }} – MuscleMap{% endblock %}

{% block content %}
  <h1>{{ muscle_name.title() }}</h1>
  <!-- optionally show a zoomed-in image -->
  <img src="{{ url_for('static', filename='gifs/' + muscle_name + '.gif') }}"
       alt="{{ muscle_name }} animation"
       class="img-fluid mb-4" />
  <p>
    <!-- placeholder text; swap for your real content -->
    Here you can describe the <strong>{{ muscle_name }}</strong> muscle,
    its origin/insertion, function, and best exercises to target it.
  </p>
  <a href="{{ url_for('muscle_map') }}" class="btn btn-secondary">
    ← Back to Map
  </a>
{% endblock %}
