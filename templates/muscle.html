{% extends "index.html" %}

{% block title %}Muscle Map – MuscleMap{% endblock %}

{% block content %}
  <h1 class="mb-4">Muscle Map</h1>
  <div class="position-relative d-inline-block">
    <img
      src="{{ url_for('static', filename='images/muscle_map.png') }}"
      alt="Muscle Map"
      class="img-fluid"
      usemap="#muscleMap"
    />
    <map name="muscleMap">
      <!-- example coords—tweak these to your image -->
      <area shape="poly" coords="150,100, 180,100, 200,200, 150,200"
            alt="Biceps" href="{{ url_for('muscle_page', muscle_name='biceps') }}"
            class="muscle-area" />
      <!-- repeat for each muscle -->
    </map>
  </div>
{% endblock %}
