    <p class="text-muted">Hover over any muscle group to highlight it, and click to learn more!</p>
  </div>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const designModeToggle = document.getElementById('designModeToggle');
    const muscleLinks = document.getElementById('muscle-links');
    let designMode = false;

    designModeToggle.addEventListener('click', function() {
        designMode = !designMode;
        if (designMode) {
            muscleLinks.style.pointerEvents = 'none';
            designModeToggle.textContent = 'Disable Design Mode';
            designModeToggle.classList.replace('btn-outline-primary', 'btn-primary');
        } else {
            muscleLinks.style.pointerEvents = 'auto';
            designModeToggle.textContent = 'Enable Design Mode';
            designModeToggle.classList.replace('btn-primary', 'btn-outline-primary');
        }
    });
});
</script>
{% endblock %}
