{% extends "base.html" %}
{% block title %}{{ muscle.name }} – Overview{% endblock %}

{% block content %}
  <h1>{{ muscle.name }}</h1>
  <img src="{{ url_for('static', filename='images/' + muscle.image) }}"
       alt="{{ muscle.name }}" class="img-fluid mb-4" />

  <p>{{ muscle.description }}</p>
  <p><strong>Fun Fact:</strong> {{ muscle.fun_fact }}</p>

  <a href="{{ url_for('muscle_page', muscle_name=muscle_name, page=2) }}" class="btn btn-primary mt-4">
    Next: How to Train {{ muscle.name.split()[0] }} →
  </a>
{% endblock %}
